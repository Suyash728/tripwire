[project]
name = "hackathon-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165,<0.166",
    "uvicorn[standard]>=0.54,<0.55",
    "openai>=2.30,<4",
    "langgraph>=1.2.24,<1.3",
    "python-dotenv>=1.0",
    "slowapi>=0.1.10",
    "supabase>=2.34,<3",
]

[project.optional-dependencies]
# Only install when distinct roles ARE the demo story (section 4 decision rule).
crew = ["crewai>=1.15.44,<1.16"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "httpx>=0.27",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.5.0",
    "bandit>=1.9.4",
    "pip-audit>=2.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify, RUF ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/agents/crew.py"]  # optional extra (uv sync --extra crew), not installed in CI

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
